services:
  web:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
    environment:
      DATABASE_URL: postgres://app@db/app
  db:
    image: postgres:16
    networks:
      - backend
  proxy:
    image: nginx:1.27
    depends_on:
      - web

networks:
  backend:
