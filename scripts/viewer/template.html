<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RM Context Viewer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 96 96' width='96' height='96'%3E%3Crect width='96' height='96' rx='22' fill='%2316161D'/%3E%3Cg stroke='%23FFFFFF'%3E%3Cg fill='none' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M30 20V76'/%3E%3Cpath d='M30 20H48A15 15 0 0 1 48 50H30'/%3E%3Cpath d='M46 50L68 76'/%3E%3C/g%3E%3C/g%3E%3Cg fill='%23FFFFFF'%3E%3Ccircle cx='30' cy='20' r='7'/%3E%3Ccircle cx='30' cy='76' r='7'/%3E%3Ccircle cx='68' cy='76' r='7'/%3E%3C/g%3E%3Ccircle cx='46' cy='50' r='9' fill='%237C6FF7' stroke='%2316161D' stroke-width='3'/%3E%3C/svg%3E">
<style>
:root{--bg:#fbfbfc;--panel:#ffffff;--fg:#16161d;--muted:#62626e;--faint:#9a9aa6;--line:#e6e6ec;--hover:#f2f2f6;--accent:#5b4cf0;--accent-soft:#ecebfd;--danger:#c93c3c;--gantt-bg:#ffffff;
--l-business:#d9822b;--l-system:#6d5ef5;--l-engineering:#2b8fd0;--l-infrastructure:#2f9e6b;--l-project:#cf4677;--l-unknown:#888}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#111116;--panel:#17171e;--fg:#e9e9ef;--muted:#a3a3b0;--faint:#6e6e7b;--line:#2a2a34;--hover:#1f1f28;--accent:#9389ff;--accent-soft:#23214a;--danger:#ef6b6b;--gantt-bg:#ffffff;
--l-business:#eea05a;--l-system:#958aff;--l-engineering:#5bb3ea;--l-infrastructure:#55c08d;--l-project:#ea7099}}
:root[data-theme=dark]{--bg:#111116;--panel:#17171e;--fg:#e9e9ef;--muted:#a3a3b0;--faint:#6e6e7b;--line:#2a2a34;--hover:#1f1f28;--accent:#9389ff;--accent-soft:#23214a;--danger:#ef6b6b;
--l-business:#eea05a;--l-system:#958aff;--l-engineering:#5bb3ea;--l-infrastructure:#55c08d;--l-project:#ea7099}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:13px/1.45 Inter,"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--fg);background:var(--bg);display:grid;grid-template-columns:200px 1fr;grid-template-rows:48px 1fr;overflow:hidden}
header{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;white-space:nowrap}.brand small{font-weight:400;color:var(--muted)}
.search{position:relative;flex:1;max-width:420px}.search input{width:100%;font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--fg)}
.search input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
#results{position:absolute;top:34px;left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:7px;max-height:340px;overflow:auto;z-index:20;display:none;box-shadow:0 6px 24px rgba(0,0,0,.08)}
#results div{padding:6px 10px;cursor:pointer;display:flex;gap:8px;align-items:baseline}#results div:hover,#results div.on{background:var(--hover)}
.meta{color:var(--muted);margin-left:auto;white-space:nowrap}
nav{border-right:1px solid var(--line);background:var(--panel);padding:10px 8px;overflow:auto}
nav button{display:flex;width:100%;justify-content:space-between;font:inherit;color:var(--fg);background:none;border:0;padding:7px 10px;border-radius:6px;cursor:pointer;text-align:left}
nav button:hover{background:var(--hover)}nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}nav .n{color:var(--faint);font-variant-numeric:tabular-nums}
nav h4{margin:14px 10px 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);font-weight:600}
main{position:relative;overflow:hidden;display:flex}
.page{flex:1;overflow:auto;padding:20px 24px;display:none}.page.on{display:block}
#graphwrap{flex:1;position:relative;display:none}#graphwrap.on{display:block}
canvas{display:block;width:100%;height:100%;cursor:grab}canvas.drag{cursor:grabbing}
.toolbar{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.toolbar>*{pointer-events:auto}
.chip{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:3px 8px;cursor:pointer;display:inline-flex;gap:5px;align-items:center}
.chip.off{opacity:.45}.chip .dot{width:8px;height:8px;border-radius:50%}.chip:hover{border-color:var(--faint)}
.legend{position:absolute;left:10px;bottom:10px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;max-width:calc(100% - 20px);max-height:45%;overflow:auto}
.legend .types{display:flex;flex-wrap:wrap;gap:4px;max-width:560px}.legend .edges{margin-top:6px;color:var(--muted);font-size:11px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.legend svg{vertical-align:middle}
aside{width:340px;border-left:1px solid var(--line);background:var(--panel);overflow:auto;padding:14px 16px;display:none}aside.on{display:block}
aside h2{font-size:15px;margin:2px 0 4px;word-break:break-word}aside h3{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);margin:16px 0 6px}
.kv{display:grid;grid-template-columns:90px 1fr;gap:3px 8px}.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:4px;background:var(--hover);color:var(--muted);margin-right:4px}
.tag.verified{color:#2f9e6b}.tag.inferred{color:#c27a12}.tag.manual{color:var(--accent)}.tag.stale{color:var(--danger)}
.rel{display:block;width:100%;text-align:left;font:inherit;color:var(--fg);background:none;border:0;padding:3px 4px;border-radius:4px;cursor:pointer}.rel:hover{background:var(--hover)}.rel .t{color:var(--faint);font-size:11px;margin-right:6px}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
.ev{padding:4px 0;border-bottom:1px solid var(--line);font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all}
.close{float:right;border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;line-height:1}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px 28px}
section.block{margin-bottom:26px}section.block h2{font-size:13px;margin:0 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.stat{display:flex;justify-content:space-between;gap:16px;padding:3px 0}.stat span{white-space:nowrap}.stat b{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.bar{height:6px;background:var(--hover);border-radius:3px;overflow:hidden;margin:4px 0 10px}.bar i{display:block;height:100%;background:var(--accent)}
table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--bg);cursor:pointer;user-select:none}tr.click{cursor:pointer}tr.click:hover td{background:var(--hover)}
.split{display:flex;gap:20px;align-items:flex-start}.split>.list{flex:1;min-width:0}
.empty{color:var(--muted);padding:20px 0}
.gantt{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
.hint{color:var(--faint);font-size:11px;position:absolute;right:12px;bottom:10px;background:var(--panel);padding:2px 6px;border-radius:4px}
@media (max-width:820px){body{grid-template-columns:1fr;grid-template-rows:48px auto 1fr}nav{display:flex;overflow-x:auto;padding:4px;border-right:0;border-bottom:1px solid var(--line)}nav h4{display:none}nav button{width:auto;white-space:nowrap}aside{position:absolute;right:0;top:0;bottom:0;width:min(340px,100%);z-index:10}.brand small{display:none}}
</style>
</head>
<body>
<header>
  <div class="brand"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="24" height="24" aria-hidden="true"><rect width="96" height="96" rx="22" fill="#16161D"/><g stroke="#FFFFFF"><g fill="none" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"><path d="M30 20V76"/><path d="M30 20H48A15 15 0 0 1 48 50H30"/><path d="M46 50L68 76"/></g></g><g fill="#FFFFFF"><circle cx="30" cy="20" r="7"/><circle cx="30" cy="76" r="7"/><circle cx="68" cy="76" r="7"/></g><circle cx="46" cy="50" r="9" fill="#7C6FF7" stroke="#16161D" stroke-width="3"/></svg>
    <span id="pname">RM Context</span><small id="pmeta"></small></div>
  <div class="search"><input id="q" placeholder="Search nodes — name, id, path   ( / )" autocomplete="off" aria-label="Search"><div id="results" role="listbox"></div></div>
  <button class="chip" id="theme" title="Toggle theme">◐</button>
</header>
<nav id="nav"></nav>
<main>
  <div class="page" id="p-overview"></div>
  <div id="graphwrap">
    <canvas id="cv" aria-label="Knowledge graph"></canvas>
    <div class="toolbar" id="toolbar"></div>
    <div class="legend" id="legend"></div>
    <div class="hint">scroll: zoom · drag: pan · click: select · double-click: focus</div>
  </div>
  <div class="page" id="p-project"></div>
  <div class="page" id="p-documents"></div>
  <aside id="detail"></aside>
</main>
<script>
const DATA = /*__RMC_DATA__*/null;
const renderGanttSvg = /*__GANTT__*/null;
(function () {
'use strict';
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const LAYERS = DATA.layers; // layer → [types]
const LAYER_OF = {}; for (const [l, ts] of Object.entries(LAYERS)) for (const t of ts) LAYER_OF[t] = l;
const nodes = DATA.graph.nodes, edges = DATA.graph.edges;
const byId = new Map(nodes.map((n) => [n.id, n]));
const out = new Map(), inc = new Map();
for (const e of edges) { (out.get(e.source) || out.set(e.source, []).get(e.source)).push(e); (inc.get(e.target) || inc.set(e.target, []).get(e.target)).push(e); }
for (const n of nodes) n.deg = (out.get(n.id) || []).length + (inc.get(n.id) || []).length;

// ---------- views: filters over one graph, so relationships survive switching ----------
const VIEWS = [
  { id: 'overview', label: 'Overview', page: true },
  { id: 'graph', label: 'Knowledge graph', layers: Object.keys(LAYERS), hide: ['function'] },
  { id: 'business', label: 'Business', layers: ['business', 'project'], group: 'Views' },
  { id: 'system', label: 'System architecture', layers: ['system'], group: 'Views' },
  { id: 'code', label: 'Code dependencies', layers: ['engineering'], hide: ['function'], group: 'Views' },
  { id: 'infra', label: 'Infrastructure', layers: ['infrastructure'], group: 'Views' },
  { id: 'project', label: 'Project management', page: true, group: 'Delivery' },
  { id: 'documents', label: 'Documents', page: true, group: 'Delivery' },
];
const state = { view: 'overview', selected: null, hiddenTypes: new Set(), conf: new Set(['verified', 'inferred', 'manual']), impact: null, theme: null };
try { const s = JSON.parse(localStorage.getItem('rmc-viewer') || '{}'); if (s.view) state.view = s.view; if (s.theme) { state.theme = s.theme; document.documentElement.dataset.theme = s.theme; } } catch {}
const persist = () => { try { localStorage.setItem('rmc-viewer', JSON.stringify({ view: state.view, theme: state.theme })); } catch {} };

function viewTypes(v) { return new Set((v.layers || []).flatMap((l) => LAYERS[l])); }
function countLayer(ls) { return nodes.filter((n) => ls.includes(LAYER_OF[n.type])).length; }

// ---------- nav ----------
function drawNav() {
  let html = '', group = null;
  for (const v of VIEWS) {
    if (v.group !== group) { group = v.group; if (group) html += `<h4>${group}</h4>`; }
    const n = v.page ? (v.id === 'documents' ? DATA.documents.length : v.id === 'project' ? (DATA.plan?.tasks.length || 0) : '') : countLayer(v.layers);
    html += `<button data-v="${v.id}" class="${state.view === v.id ? 'on' : ''}"><span>${v.label}</span><span class="n">${n}</span></button>`;
  }
  $('#nav').innerHTML = html;
  $('#nav').querySelectorAll('button').forEach((b) => (b.onclick = () => show(b.dataset.v)));
}

function show(id) {
  state.view = id; persist(); drawNav();
  if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
  const v = VIEWS.find((x) => x.id === id);
  document.querySelectorAll('.page').forEach((p) => p.classList.toggle('on', p.id === 'p-' + id));
  $('#graphwrap').classList.toggle('on', !v.page);
  if (!v.page) { state.hiddenTypes = new Set(v.hide || []); drawToolbar(); layoutFor(v); resize(); }
  if (id === 'overview') drawOverview();
  if (id === 'project') drawProject();
  if (id === 'documents') drawDocuments();
}

// ---------- overview ----------
function drawOverview() {
  const s = DATA.stats, m = DATA.manifest, st = m.stack || {};
  const list = (xs) => (xs && xs.length ? xs.map(esc).join(', ') : '<span class="meta">none detected</span>');
  const p = DATA.progress;
  const docs = DATA.documents.reduce((a, d) => ((a[d.status] = (a[d.status] || 0) + 1), a), {});
  const rtm = DATA.rtm.reduce((a, r) => ((a[r.status] = (a[r.status] || 0) + 1), a), {});
  const pct = (v) => `<div class="bar"><i style="width:${Math.max(0, Math.min(100, v || 0))}%"></i></div>`;
  $('#p-overview').innerHTML = `<h1>${esc(m.project.name)}</h1>
  <p class="sub">Snapshot generated ${esc(DATA.generatedAt)} · last scan ${esc(m.scan?.timestamp)} (${esc(m.scan?.mode)})${m.scan?.commit ? ' · commit <code>' + esc(m.scan.commit.slice(0, 10)) + '</code>' : ''}</p>
  <div class="grid">
   <section class="block"><h2>Technology</h2>
     <div class="stat"><span>Languages</span><b>${list(Object.keys(st.languages || {}))}</b></div>
     <div class="stat"><span>Frameworks</span><b>${list(st.frameworks)}</b></div>
     <div class="stat"><span>Data stores</span><b>${list(st.datastores)}</b></div>
     <div class="stat"><span>Infrastructure</span><b>${list(st.infrastructure)}</b></div></section>
   <section class="block"><h2>Knowledge graph</h2>
     <div class="stat"><span>Nodes / edges</span><b>${s.nodes} / ${s.edges}</b></div>
     ${Object.entries(s.byLayer).map(([l, n]) => `<div class="stat"><span><span class="tag" style="color:var(--l-${l})">●</span>${l}</span><b>${n}</b></div>`).join('')}
     <div class="stat"><span>Edges verified · inferred · manual</span><b>${s.edgeConfidence.verified || 0} · ${s.edgeConfidence.inferred || 0} · ${s.edgeConfidence.manual || 0}</b></div>
     ${s.stale ? `<div class="stat"><span class="tag stale">stale items</span><b>${s.stale}</b></div>` : ''}</section>
   <section class="block"><h2>Delivery</h2>${p ? `
     <div class="stat"><span>Verified progress</span><b>${p.verifiedPercent}%</b></div>${pct(p.verifiedPercent)}
     <div class="stat"><span>Reported progress</span><b>${p.reportedPercent}%</b></div>
     <div class="stat"><span>Planned by today</span><b>${p.plannedPercent == null ? 'n/a' : p.plannedPercent + '%'}</b></div>
     <div class="stat"><span>Tasks done · active · blocked · planned</span><b>${p.tasks.completed} · ${p.tasks.inProgress} · ${p.tasks.blocked} · ${p.tasks.planned}</b></div>` : '<p class="empty">No plan.json yet.</p>'}</section>
   <section class="block"><h2>Traceability & documents</h2>
     <div class="stat"><span>Requirements</span><b>${DATA.rtm.length}</b></div>
     ${Object.entries(rtm).map(([k, n]) => `<div class="stat"><span>${esc(k)}</span><b>${n}</b></div>`).join('')}
     <div class="stat"><span>Documents</span><b>${DATA.documents.length}</b></div>
     ${Object.entries(docs).map(([k, n]) => `<div class="stat"><span>${esc(k)}</span><b>${n}</b></div>`).join('')}</section>
  </div>
  <section class="block"><h2>Largest modules</h2>${DATA.modules.length ? `<table><tr><th>Module</th><th>Items</th></tr>${DATA.modules.map((x) => `<tr class="click" data-id="${esc(x.id)}"><td>${esc(x.name)}</td><td>${x.n}</td></tr>`).join('')}</table>` : '<p class="empty">No modules detected.</p>'}</section>
  <section class="block"><h2>Node types</h2><div class="legend-static">${Object.entries(s.byType).sort((a, b) => b[1] - a[1]).map(([t, n]) => `<span class="tag" style="color:var(--l-${LAYER_OF[t] || 'unknown'})">${esc(t)} ${n}</span>`).join(' ')}</div></section>
  <p class="empty" style="margin-top:24px">Generated by RM Context · by <a href="https://rmtemplate.com" target="_blank" rel="noopener">RM Template</a></p>`;
  $('#p-overview').querySelectorAll('tr.click').forEach((r) => (r.onclick = () => { show('graph'); select(r.dataset.id, true); }));
}

// ---------- project ----------
function drawProject() {
  const plan = DATA.plan, el = $('#p-project');
  if (!plan) { el.innerHTML = '<h1>Project management</h1><p class="empty">No plan.json yet. The Project Manager agent creates it with <code>rmc pm init</code>.</p>'; return; }
  const p = DATA.progress;
  const STAT = ['Planned', 'In Progress', 'Blocked', 'Completed', 'Cancelled'];
  const on = new Set(STAT);
  el.innerHTML = `<h1>${esc(plan.project?.name || 'Project')}</h1>
   <p class="sub">Verified ${p.verifiedPercent}% · reported ${p.reportedPercent}% · planned ${p.plannedPercent == null ? 'n/a' : p.plannedPercent + '%'} (as of ${esc(p.asOf)}). ${DATA.critical.length ? 'Critical path: ' + DATA.critical.map(esc).join(' → ') : 'Critical path: not enough dependency/date data.'}</p>
   <div id="gfilter" style="margin-bottom:8px"></div><div class="gantt" id="gantt"></div>
   <section class="block" style="margin-top:22px"><h2>Tasks</h2><table id="tasks"></table></section>`;
  const draw = () => { $('#gantt').innerHTML = renderGanttSvg(plan, { statuses: [...on], critical: DATA.critical }); };
  $('#gfilter').innerHTML = STAT.map((s) => `<button class="chip" data-s="${s}">${s}</button>`).join(' ');
  $('#gfilter').querySelectorAll('button').forEach((b) => (b.onclick = () => { on.has(b.dataset.s) ? on.delete(b.dataset.s) : on.add(b.dataset.s); b.classList.toggle('off'); draw(); }));
  draw();
  const parents = new Set(plan.tasks.map((t) => t.parent).filter(Boolean));
  const rows = plan.tasks.map((t) => `<tr><td>${esc(t.id)}</td><td>${esc(t.name)}${t.milestone ? ' <span class="tag">milestone</span>' : ''}</td><td>${esc(t.owner || '—')}</td><td>${esc(t.start || 'TBD')} → ${esc(t.end || 'TBD')}</td><td>${esc(t.status)}</td><td>${parents.has(t.id) ? '—' : (t.progress ?? (t.status === 'Completed' ? 100 : 0)) + '%'}</td><td>${esc((t.dependencies || []).join(', ') || '—')}</td><td>${(t.evidence || []).map((x) => `<span class="tag">${esc(x.type)}</span>${esc(x.ref)}`).join('<br>') || '—'}</td></tr>`).join('');
  $('#tasks').innerHTML = `<tr><th>ID</th><th>Task</th><th>Owner</th><th>Planned</th><th>Status</th><th>Progress</th><th>Depends on</th><th>Evidence</th></tr>${rows}`;
}

// ---------- documents ----------
function drawDocuments() {
  const el = $('#p-documents');
  if (!DATA.documents.length) { el.innerHTML = '<h1>Documents</h1><p class="empty">No documents yet. Create one with <code>/rm-context:document</code>.</p>'; return; }
  el.innerHTML = `<h1>Documents</h1><p class="sub">${DATA.documents.length} registered. Status changes to Approved only with explicit user approval.</p>
  <table><tr><th>ID</th><th>Title</th><th>Type</th><th>Status</th><th>Version</th><th>Author</th><th>Updated</th><th>Linked nodes</th></tr>
  ${DATA.documents.map((d) => `<tr><td><a href="../${esc(d.path)}">${esc(d.id)}</a></td><td>${esc(d.title)}${d.needsReview ? ' <span class="tag stale">needs review</span>' : ''}</td><td>${esc(d.type)}</td><td>${esc(d.status)}</td><td>${d.version}</td><td>${esc(d.author)}</td><td>${esc((d.updatedAt || '').slice(0, 10))}</td><td>${(d.nodes || []).map((n) => `<a href="#" data-id="${esc(n)}">${esc(n)}</a>`).join(', ') || '—'}</td></tr>`).join('')}</table>`;
  el.querySelectorAll('a[data-id]').forEach((a) => (a.onclick = (e) => { e.preventDefault(); show('graph'); select(a.dataset.id, true); }));
}

// ---------- graph rendering ----------
const cv = $('#cv'), ctx = cv.getContext('2d');
let W = 0, H = 0, dpr = 1;
const cam = { x: 0, y: 0, k: 1 };
let visible = [], visibleSet = new Set(), visEdges = [], curTypes = new Set(), alpha = 0, raf = 0;

function hash(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0) / 4294967295; }
const LAYER_POS = { business: [-1, -0.6], system: [0, -0.9], engineering: [0, 0.3], infrastructure: [1, -0.4], project: [-0.9, 0.7], unknown: [0, 0] };
for (const n of nodes) { const [lx, ly] = LAYER_POS[LAYER_OF[n.type] || 'unknown']; const r = 120 + hash(n.id) * 260, a = hash(n.id + '*') * Math.PI * 2; n.x = lx * 520 + Math.cos(a) * r; n.y = ly * 420 + Math.sin(a) * r; n.vx = 0; n.vy = 0; }

function computeVisible() {
  const v = VIEWS.find((x) => x.id === state.view);
  const types = viewTypes(v);
  curTypes = types;
  const base = nodes.filter((n) => types.has(n.type) && !state.hiddenTypes.has(n.type) && state.conf.has(n.confidence));
  visibleSet = new Set(base.map((n) => n.id));
  // Keep cross-layer neighbours of the selection visible so switching views never hides a relationship.
  if (state.selected) { visibleSet.add(state.selected); for (const e of [...(out.get(state.selected) || []), ...(inc.get(state.selected) || [])]) { visibleSet.add(e.source); visibleSet.add(e.target); } }
  if (state.impact) for (const id of state.impact.keys()) visibleSet.add(id);
  visible = [...visibleSet].map((id) => byId.get(id)).filter(Boolean);
  visEdges = edges.filter((e) => visibleSet.has(e.source) && visibleSet.has(e.target) && state.conf.has(e.confidence));
}
function layoutFor() { computeVisible(); alpha = 1; kick(); setTimeout(fit, 450); }
function kick() { if (!raf) raf = requestAnimationFrame(tick); }
function tick() {
  raf = 0;
  if (alpha > 0.02) { simulate(); alpha *= 0.965; }
  draw();
  if (alpha > 0.02) kick();
}
function simulate() {
  const CELL = 140, grid = new Map();
  for (const n of visible) { const k = Math.floor(n.x / CELL) + ',' + Math.floor(n.y / CELL); (grid.get(k) || grid.set(k, []).get(k)).push(n); }
  for (const n of visible) {
    const cx = Math.floor(n.x / CELL), cy = Math.floor(n.y / CELL);
    for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) for (const m of grid.get(cx + i + ',' + (cy + j)) || []) {
      if (m === n) continue;
      let dx = n.x - m.x, dy = n.y - m.y, d2 = dx * dx + dy * dy || 0.01;
      if (d2 > CELL * CELL) continue;
      const f = (900 / d2) * alpha; n.vx += dx * f; n.vy += dy * f;
    }
    n.vx -= n.x * 0.0015 * alpha; n.vy -= n.y * 0.0015 * alpha;
  }
  for (const e of visEdges) {
    const a = byId.get(e.source), b = byId.get(e.target);
    const dx = b.x - a.x, dy = b.y - a.y, d = Math.sqrt(dx * dx + dy * dy) || 1;
    const f = ((d - 70) / d) * 0.03 * alpha;
    a.vx += dx * f; a.vy += dy * f; b.vx -= dx * f; b.vy -= dy * f;
  }
  for (const n of visible) { if (n === dragNode) continue; n.vx *= 0.6; n.vy *= 0.6; n.x += Math.max(-30, Math.min(30, n.vx)); n.y += Math.max(-30, Math.min(30, n.vy)); }
}
const radius = (n) => 3.5 + Math.min(9, Math.sqrt(n.deg) * 1.6);
const color = (n) => css('--l-' + (LAYER_OF[n.type] || 'unknown'));
function neighbours(id) { const s = new Set([id]); for (const e of [...(out.get(id) || []), ...(inc.get(id) || [])]) { s.add(e.source); s.add(e.target); } return s; }

function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.translate(W / 2 + cam.x, H / 2 + cam.y); ctx.scale(cam.k, cam.k);
  const focus = state.impact ? new Set(state.impact.keys()) : state.selected ? neighbours(state.selected) : null;
  const lineCol = css('--faint'), fg = css('--fg'), accent = css('--accent'), danger = css('--danger'), bg = css('--panel');
  ctx.lineWidth = 1 / cam.k;
  for (const e of visEdges) {
    const a = byId.get(e.source), b = byId.get(e.target);
    const on = focus ? focus.has(a.id) && focus.has(b.id) && (state.impact || a.id === state.selected || b.id === state.selected) : true;
    ctx.globalAlpha = focus ? (on ? 0.9 : 0.06) : 0.35;
    ctx.strokeStyle = e.stale ? danger : on && focus ? accent : lineCol;
    ctx.setLineDash(e.confidence === 'inferred' ? [4 / cam.k, 3 / cam.k] : e.confidence === 'manual' ? [1 / cam.k, 3 / cam.k] : []);
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    if (on && focus) { const ang = Math.atan2(b.y - a.y, b.x - a.x), r = radius(b) + 2; ctx.setLineDash([]); ctx.beginPath(); ctx.moveTo(b.x - Math.cos(ang) * r, b.y - Math.sin(ang) * r); ctx.lineTo(b.x - Math.cos(ang - 0.4) * (r + 7), b.y - Math.sin(ang - 0.4) * (r + 7)); ctx.lineTo(b.x - Math.cos(ang + 0.4) * (r + 7), b.y - Math.sin(ang + 0.4) * (r + 7)); ctx.closePath(); ctx.fillStyle = accent; ctx.fill(); }
  }
  ctx.setLineDash([]);
  for (const n of visible) {
    const dim = focus && !focus.has(n.id);
    ctx.globalAlpha = dim ? 0.12 : 1;
    const r = radius(n);
    ctx.beginPath();
    if (['file', 'test', 'table', 'container'].includes(n.type)) ctx.rect(n.x - r * 0.85, n.y - r * 0.85, r * 1.7, r * 1.7);
    else if (['task', 'milestone', 'risk', 'issue', 'question', 'assumption'].includes(n.type)) { ctx.moveTo(n.x, n.y - r); ctx.lineTo(n.x + r, n.y); ctx.lineTo(n.x, n.y + r); ctx.lineTo(n.x - r, n.y); ctx.closePath(); }
    else ctx.arc(n.x, n.y, r, 0, Math.PI * 2);
    ctx.fillStyle = color(n); ctx.fill();
    if (n.stale) { ctx.strokeStyle = danger; ctx.lineWidth = 2 / cam.k; ctx.stroke(); }
    if (n.id === state.selected) { ctx.strokeStyle = fg; ctx.lineWidth = 2.5 / cam.k; ctx.stroke(); }
    if (!curTypes.has(n.type)) { ctx.strokeStyle = bg; ctx.lineWidth = 1.5 / cam.k; ctx.stroke(); }
  }
  const showAll = cam.k > 1.3 || visible.length < 60;
  ctx.font = `${11 / cam.k}px Inter, Segoe UI, sans-serif`; ctx.textBaseline = 'middle';
  for (const n of visible) {
    if (!(showAll || n.deg > 8 || (focus && focus.has(n.id)))) continue;
    if (focus && !focus.has(n.id)) continue;
    ctx.globalAlpha = 1;
    const label = n.type === 'file' || n.type === 'test' ? n.name.split('/').pop() : n.name;
    ctx.lineWidth = 3 / cam.k; ctx.strokeStyle = bg; ctx.strokeText(label.slice(0, 40), n.x + radius(n) + 3, n.y);
    ctx.fillStyle = fg; ctx.fillText(label.slice(0, 40), n.x + radius(n) + 3, n.y);
  }
  ctx.globalAlpha = 1;
}
function resize() { const r = cv.getBoundingClientRect(); dpr = window.devicePixelRatio || 1; W = r.width; H = r.height; cv.width = W * dpr; cv.height = H * dpr; draw(); }
window.addEventListener('resize', () => $('#graphwrap').classList.contains('on') && resize());
function fit() {
  if (!visible.length) return;
  const xs = visible.map((n) => n.x), ys = visible.map((n) => n.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  cam.k = Math.max(0.15, Math.min(2.5, Math.min((W - 80) / (maxX - minX || 1), (H - 160) / (maxY - minY || 1))));
  cam.x = -((minX + maxX) / 2) * cam.k; cam.y = -((minY + maxY) / 2) * cam.k + 10;
  draw();
}
const toWorld = (ev) => { const r = cv.getBoundingClientRect(); return { x: (ev.clientX - r.left - W / 2 - cam.x) / cam.k, y: (ev.clientY - r.top - H / 2 - cam.y) / cam.k }; };
function hit(p) { let best = null, bd = Infinity; for (const n of visible) { const d = (n.x - p.x) ** 2 + (n.y - p.y) ** 2, r = radius(n) + 4 / cam.k; if (d < r * r && d < bd) { best = n; bd = d; } } return best; }
let dragNode = null, panning = null, moved = false;
cv.addEventListener('mousedown', (ev) => { moved = false; const n = hit(toWorld(ev)); if (n) dragNode = n; else panning = { x: ev.clientX - cam.x, y: ev.clientY - cam.y }; cv.classList.add('drag'); });
window.addEventListener('mousemove', (ev) => {
  if (dragNode) { const p = toWorld(ev); dragNode.x = p.x; dragNode.y = p.y; moved = true; draw(); }
  else if (panning) { cam.x = ev.clientX - panning.x; cam.y = ev.clientY - panning.y; moved = true; draw(); }
  else if (ev.target === cv) { const n = hit(toWorld(ev)); cv.title = n ? `${n.name} (${n.type})` : ''; }
});
window.addEventListener('mouseup', (ev) => {
  if (!moved && ev.target === cv) { const n = hit(toWorld(ev)); n ? select(n.id) : clearSelection(); }
  dragNode = null; panning = null; cv.classList.remove('drag');
});
cv.addEventListener('dblclick', (ev) => { const n = hit(toWorld(ev)); if (n) { cam.k = Math.max(cam.k, 1.6); cam.x = -n.x * cam.k; cam.y = -n.y * cam.k; draw(); } });
cv.addEventListener('wheel', (ev) => { ev.preventDefault(); const p = toWorld(ev), k = Math.max(0.08, Math.min(6, cam.k * Math.exp(-ev.deltaY * 0.0015))); cam.x -= p.x * (k - cam.k); cam.y -= p.y * (k - cam.k); cam.k = k; draw(); }, { passive: false });

// ---------- toolbar & legend ----------
function drawToolbar() {
  const v = VIEWS.find((x) => x.id === state.view);
  const types = [...viewTypes(v)].filter((t) => nodes.some((n) => n.type === t));
  $('#toolbar').innerHTML = `<button class="chip" id="fit">Fit</button>` +
    ['verified', 'inferred', 'manual'].map((c) => `<button class="chip ${state.conf.has(c) ? '' : 'off'}" data-c="${c}">${c}</button>`).join('') +
    (state.impact ? `<button class="chip" id="clrimpact" style="border-color:var(--accent);color:var(--accent)">Impact of ${esc(byId.get(state.impactFrom)?.name || '')} · ${state.impact.size - 1} affected ✕</button>` : '');
  $('#fit').onclick = fit;
  $('#toolbar').querySelectorAll('[data-c]').forEach((b) => (b.onclick = () => { state.conf.has(b.dataset.c) ? state.conf.delete(b.dataset.c) : state.conf.add(b.dataset.c); drawToolbar(); computeVisible(); alpha = 0.3; kick(); }));
  if (state.impact) $('#clrimpact').onclick = () => { state.impact = null; drawToolbar(); computeVisible(); draw(); };
  $('#legend').innerHTML = `<div class="types">${types.map((t) => `<button class="chip ${state.hiddenTypes.has(t) ? 'off' : ''}" data-t="${t}"><span class="dot" style="background:var(--l-${LAYER_OF[t]})"></span>${t} <span class="meta">${nodes.filter((n) => n.type === t).length}</span></button>`).join('')}</div>
   <div class="edges"><span><svg width="26" height="6"><line x1="0" y1="3" x2="26" y2="3" stroke="currentColor"/></svg> verified</span><span><svg width="26" height="6"><line x1="0" y1="3" x2="26" y2="3" stroke="currentColor" stroke-dasharray="4 3"/></svg> inferred</span><span><svg width="26" height="6"><line x1="0" y1="3" x2="26" y2="3" stroke="currentColor" stroke-dasharray="1 3"/></svg> manual</span><span>● component · ■ file/table · ◆ task/risk</span><span style="color:var(--danger)">red = stale</span></div>`;
  $('#legend').querySelectorAll('[data-t]').forEach((b) => (b.onclick = () => { const t = b.dataset.t; state.hiddenTypes.has(t) ? state.hiddenTypes.delete(t) : state.hiddenTypes.add(t); drawToolbar(); computeVisible(); alpha = 0.3; kick(); }));
}

// ---------- selection & detail ----------
function evidenceLink(e) {
  if (!e.file) return esc(e.type + (e.ref ? ': ' + e.ref : ''));
  const loc = e.file + (e.lines ? ':' + e.lines[0] + (e.lines[1] !== e.lines[0] ? '-' + e.lines[1] : '') : '');
  const rel = '../../' + e.file.split('/').map(encodeURIComponent).join('/');
  let vs = '';
  if (location.protocol === 'file:') { const root = decodeURIComponent(location.pathname).replace(/\/\.rmcontext\/viewer\/[^/]*$/, '').replace(/^\/([A-Za-z]:)/, '$1'); vs = ` · <a href="vscode://file/${encodeURI(root + '/' + e.file)}${e.lines ? ':' + e.lines[0] : ''}">VS Code</a>`; }
  return `<a href="${rel}" target="_blank" rel="noopener">${esc(loc)}</a> <span class="tag">${esc(e.type)}</span><span class="tag ${esc(e.confidence || '')}">${esc(e.confidence || '')}</span>${vs}`;
}
function select(id, center) {
  const n = byId.get(id); if (!n) return;
  state.selected = id;
  if (state.impact && state.impactFrom !== id) state.impact = null;
  computeVisible(); drawToolbar();
  if (center) { cam.k = Math.max(cam.k, 1.2); cam.x = -n.x * cam.k; cam.y = -n.y * cam.k; }
  alpha = Math.max(alpha, 0.15); kick();
  const group = (list, dir) => {
    const by = {}; for (const e of list) (by[e.type] ||= []).push(e);
    return Object.entries(by).map(([t, es]) => `<div class="meta" style="margin:6px 0 2px">${dir === 'out' ? t + ' →' : '← ' + t}</div>` + es.slice(0, 40).map((e) => { const o = byId.get(dir === 'out' ? e.target : e.source); return `<button class="rel" data-id="${esc(o.id)}"><span class="t">${esc(o.type)}</span>${esc(o.name)} <span class="tag ${e.confidence}">${e.confidence}</span>${e.stale ? '<span class="tag stale">stale</span>' : ''}</button>`; }).join('') + (es.length > 40 ? `<div class="meta">+${es.length - 40} more</div>` : '')).join('');
  };
  const o = out.get(id) || [], i = inc.get(id) || [];
  const docs = DATA.documents.filter((d) => (d.nodes || []).includes(id));
  const attrs = Object.entries(n.attrs || {}).filter(([, v]) => v !== '' && v != null);
  $('#detail').innerHTML = `<button class="close" aria-label="Close">×</button>
   <div class="meta" style="margin:0"><span class="tag" style="color:var(--l-${LAYER_OF[n.type]})">● ${esc(LAYER_OF[n.type] || '?')}</span>${esc(n.type)}</div>
   <h2>${esc(n.name)}</h2>
   <div><span class="tag ${n.confidence}">${n.confidence}</span><span class="tag">${esc(n.origin)}</span>${n.stale ? '<span class="tag stale">stale — evidence changed</span>' : ''}</div>
   ${n.description ? `<p>${esc(n.description)}</p>` : ''}
   <dl class="kv" style="margin-top:10px"><dt>ID</dt><dd><code>${esc(n.id)}</code></dd>${attrs.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(Array.isArray(v) ? (typeof v[0] === 'object' ? v.map((x) => x.name + (x.type ? ' ' + x.type : '')).join(', ') : v.join(', ')) : typeof v === 'object' ? JSON.stringify(v) : v)}</dd>`).join('')}</dl>
   <p style="margin-top:12px"><button class="chip" id="impactbtn">Show change impact</button></p>
   <h3>Evidence (${(n.evidence || []).length})</h3>${(n.evidence || []).map((e) => `<div class="ev">${evidenceLink(e)}</div>`).join('') || '<div class="meta">No source evidence recorded.</div>'}
   <h3>Outgoing (${o.length})</h3>${group(o, 'out') || '<div class="meta">none</div>'}
   <h3>Incoming (${i.length})</h3>${group(i, 'in') || '<div class="meta">none</div>'}
   ${docs.length ? `<h3>Documents</h3>${docs.map((d) => `<div><a href="../${esc(d.path)}">${esc(d.id)}</a> ${esc(d.title)} <span class="tag">${esc(d.status)}</span></div>`).join('')}` : ''}`;
  $('#detail').classList.add('on');
  $('#detail').querySelector('.close').onclick = clearSelection;
  $('#detail').querySelectorAll('.rel').forEach((b) => (b.onclick = () => select(b.dataset.id, true)));
  $('#impactbtn').onclick = () => { state.impact = impact(id); state.impactFrom = id; computeVisible(); drawToolbar(); alpha = 0.3; kick(); };
  resize();
}
function clearSelection() { state.selected = null; state.impact = null; $('#detail').classList.remove('on'); computeVisible(); drawToolbar(); resize(); }

// Same propagation rules as `rmc impact`.
function impact(start) {
  const P = DATA.propagation, seen = new Map([[start, 0]]), q = [start];
  while (q.length) {
    const id = q.shift(), d = seen.get(id); if (d >= 4) continue;
    const steps = [];
    for (const e of out.get(id) || []) { const p = P[e.type] || {}; if (p.fwd === true || (p.fwd === 'start' && d === 0)) steps.push(e.target); }
    for (const e of inc.get(id) || []) { const p = P[e.type] || {}; if (p.back === true || (p.back === 'start' && d === 0)) steps.push(e.source); }
    for (const s of steps) if (!seen.has(s) && byId.get(s)?.type !== 'project') { seen.set(s, d + 1); q.push(s); }
  }
  return seen;
}

// ---------- search ----------
const q = $('#q'), res = $('#results');
let hits = [], hi = 0;
q.addEventListener('input', () => {
  const t = q.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
  if (!t.length) { res.style.display = 'none'; return; }
  hits = nodes.map((n) => { const s = (n.name + ' ' + n.id + ' ' + (n.description || '')).toLowerCase(); return t.every((x) => s.includes(x)) ? [n, (n.name.toLowerCase().startsWith(t[0]) ? 2 : 0) + (n.name.toLowerCase().includes(t.join(' ')) ? 1 : 0)] : null; }).filter(Boolean).sort((a, b) => b[1] - a[1] || b[0].deg - a[0].deg).slice(0, 30).map((x) => x[0]);
  hi = 0; renderHits();
});
function renderHits() {
  res.innerHTML = hits.length ? hits.map((n, i) => `<div class="${i === hi ? 'on' : ''}" data-id="${esc(n.id)}"><span class="tag" style="color:var(--l-${LAYER_OF[n.type]})">●</span>${esc(n.name)}<span class="meta">${esc(n.type)}</span></div>`).join('') : '<div class="meta">No matches</div>';
  res.style.display = 'block';
  res.querySelectorAll('[data-id]').forEach((d) => (d.onmousedown = () => pick(d.dataset.id)));
}
function pick(id) {
  res.style.display = 'none'; q.blur();
  const n = byId.get(id), layer = LAYER_OF[n.type];
  const v = VIEWS.find((x) => x.id === state.view);
  if (v.page || !viewTypes(v).has(n.type)) show(layer === 'engineering' ? 'code' : layer === 'infrastructure' ? 'infra' : layer === 'system' ? 'system' : layer === 'business' ? 'business' : 'graph');
  if (state.hiddenTypes.has(n.type)) { state.hiddenTypes.delete(n.type); drawToolbar(); }
  setTimeout(() => select(id, true), 30);
}
q.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') { hi = Math.min(hits.length - 1, hi + 1); renderHits(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { hi = Math.max(0, hi - 1); renderHits(); e.preventDefault(); }
  else if (e.key === 'Enter' && hits[hi]) pick(hits[hi].id);
  else if (e.key === 'Escape') { res.style.display = 'none'; q.blur(); }
});
q.addEventListener('blur', () => setTimeout(() => (res.style.display = 'none'), 150));
document.addEventListener('keydown', (e) => { if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); } if (e.key === 'Escape' && document.activeElement !== q) clearSelection(); });
$('#theme').onclick = () => { const dark = matchMedia('(prefers-color-scheme: dark)').matches; const cur = document.documentElement.dataset.theme || (dark ? 'dark' : 'light'); state.theme = cur === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = state.theme; persist(); if (state.view === 'project') drawProject(); draw(); };

$('#pname').textContent = DATA.manifest.project.name;
$('#pmeta').textContent = `${DATA.stats.nodes} nodes · ${DATA.stats.edges} edges`;
document.title = DATA.manifest.project.name + ' — RM Context';
const fromHash = location.hash.slice(1);
show(VIEWS.some((v) => v.id === fromHash) ? fromHash : VIEWS.some((v) => v.id === state.view) ? state.view : 'overview');
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h !== state.view && VIEWS.some((v) => v.id === h)) show(h); });
})();
</script>
</body>
